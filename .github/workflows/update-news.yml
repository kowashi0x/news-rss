name: Update Yahoo News RSS

on:
  schedule:
    - cron: '*/30 * * * *' # 30分ごとに自動実行
  workflow_dispatch:       # 手動実行ボタンを有効化

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Yahoo News XML
        run: |
          curl -s -A "Mozilla/5.0" "https://news.yahoo.co.jp/rss/topics/top-picks.xml" -o news.xml

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news.xml" && git push)
