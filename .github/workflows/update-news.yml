name: Update Yahoo News JSON

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Yahoo News JSON
        run: python3 -c "import urllib.request, xml.etree.ElementTree as ET, re, json; root = ET.fromstring(urllib.request.urlopen(urllib.request.Request('https://news.yahoo.co.jp/rss/topics/top-picks.xml', headers={'User-Agent': 'Mozilla/5.0'}), timeout=10).read()); items = []; [items.append({'title': i.findtext('title',''), 'link': i.findtext('link',''), 'pubDate': i.findtext('pubDate',''), 'image': (re.search(r'og:image[\"\'][^>]+content=[\"\']([^\"\']+)', urllib.request.urlopen(urllib.request.Request(i.findtext('link',''), headers={'User-Agent': 'Mozilla/5.0'}), timeout=10).read().decode('utf-8', 'ignore')) or [None, ''])[1]}) for i in root.findall('.//item')[:8]]; open('news.json', 'w', encoding='utf-8').write(json.dumps(items, ensure_ascii=False, indent=2))"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news.json" && git push)