<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>Yahoo news topics</title>
  <style>
    body {
      background: #050508;
      color: #fff;
      font-family: 'Segoe UI', 'Meiryo', sans-serif;
      margin: 0;
      padding: 16px;
      width: 920px;
      height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #00f0ff;
      padding-bottom: 8px;
      margin-bottom: 12px;
      height: 36px;
      flex-shrink: 0;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    .status {
      font-size: 14px;
      color: #8892b0;
    }

    /* 1列 × 4行レイアウト */
    .news-grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }

    .news-card {
      display: flex;
      align-items: center;
      background: #0d1017;
      border: 1px solid #1e2638;
      border-left: 4px solid #00f0ff;
      border-radius: 8px;
      padding: 12px 18px;
      text-decoration: none;
      color: #e6f1ff;
      transition: border-color 0.2s, background 0.2s;
      overflow: hidden;
    }

    .news-card:hover {
      border-color: #00f0ff;
      background: #131824;
    }

    .news-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .news-title {
      font-size: 24px;
      font-weight: bold;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-date {
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>YAHOO! NEWS TOPICS</h2>
    <span class="status" id="update-status">Loading...</span>
  </div>

  <div class="news-grid" id="news-container"></div>

  <script>
    const RSS_URL = 'https://news.yahoo.co.jp/rss/topics/top-picks.xml';

    // 複数の無料CORSプロキシを順番に試してXMLを直接取得する
    async function fetchRSSXml(targetUrl) {
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}&_=${Date.now()}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];

      let lastError = null;
      for (const proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          if (text.includes('<item>')) {
            return text;
          }
          throw new Error('XMLデータの形式が不正です');
        } catch (e) {
          lastError = e;
        }
      }
      throw lastError || new Error('RSSの取得に失敗しました');
    }

    async function fetchYahooNews() {
      const container = document.getElementById('news-container');
      const statusEl = document.getElementById('update-status');

      try {
        const xmlText = await fetchRSSXml(RSS_URL);
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const items = Array.from(xmlDoc.querySelectorAll('item'));

        if (items.length === 0) {
          throw new Error('記事データが見つかりません');
        }

        container.innerHTML = '';

        // 先頭4件を描画
        items.slice(0, 4).forEach(item => {
          const title = item.querySelector('title')?.textContent || '';
          const link = item.querySelector('link')?.textContent || '#';
          const pubDateRaw = item.querySelector('pubDate')?.textContent || '';

          const pubDate = new Date(pubDateRaw);
          const timeStr = isNaN(pubDate)
            ? pubDateRaw
            : `${String(pubDate.getMonth() + 1).padStart(2, '0')}/${String(pubDate.getDate()).padStart(2, '0')} ${String(pubDate.getHours()).padStart(2, '0')}:${String(pubDate.getMinutes()).padStart(2, '0')}`;

          const card = document.createElement('a');
          card.className = 'news-card';
          card.href = link;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';

          card.innerHTML = `
            <div class="news-info">
              <div class="news-title">${escapeHTML(title)}</div>
              <div class="news-date">${escapeHTML(timeStr)}</div>
            </div>
          `;

          container.appendChild(card);
        });

        const now = new Date();
        statusEl.textContent = `Updated: ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      } catch (error) {
        console.error(error);
        statusEl.textContent = 'Error';
        container.innerHTML = `<div style="color:#ff5555; font-size:16px;">
          ${escapeHTML(error.message)}
        </div>`;
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[match]));
    }

    fetchYahooNews();
    // 30分ごとに更新（10分おきにしたい場合は 30 を 10 に変更）
    setInterval(fetchYahooNews, 30 * 60 * 1000);
  </script>
</body>
</html>
