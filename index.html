<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>Yahoo news topics - LED Ticker</title>
  <style>
    body {
      background: #050505;
      color: #ff8c00;
      font-family: 'Meiryo', 'Hiragino Kaku Gothic ProN', 'MS Gothic', sans-serif;
      margin: 0;
      padding: 16px;
      width: 920px;
      height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* 上部ステータスバー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #331a00;
      padding-bottom: 10px;
      margin-bottom: 16px;
      height: 40px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge {
      background: #ff7b00;
      color: #000;
      font-weight: 900;
      font-size: 18px;
      padding: 4px 12px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .counter {
      font-size: 22px;
      font-weight: bold;
      color: #ff9d00;
      font-variant-numeric: tabular-nums;
    }

    .status {
      font-size: 16px;
      color: #8a5a2b;
    }

    /* 新幹線電光掲示板のメイン表示枠 */
    .led-board {
      flex: 1;
      background: #0a0602;
      /* LEDパネル風の微細なドット格子模様 */
      background-image:
        radial-gradient(rgba(255, 140, 0, 0.08) 1px, transparent 0);
      background-size: 6px 6px;
      border: 4px solid #261a0d;
      border-radius: 12px;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.95);
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* 流れるニュース本体（クリックで記事を開く） */
    .ticker-link {
      position: absolute;
      white-space: nowrap;
      text-decoration: none;
      color: #ff8c00;
      font-size: 110px;
      font-weight: 900;
      letter-spacing: 4px;
      /* オレンジLEDの発光感 */
      text-shadow:
        0 0 8px rgba(255, 140, 0, 0.85),
        0 0 20px rgba(255, 100, 0, 0.5);
      will-change: transform;
      cursor: pointer;
    }

    .ticker-link:hover {
      color: #ffb347;
    }

    .ticker-date {
      color: #ff5500;
      font-size: 80px;
      margin-right: 36px;
    }

    /* 下部ガイド */
    .footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #66421f;
      height: 20px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span class="badge">YAHOO! NEWS</span>
      <span class="counter" id="news-counter">[ -- / -- ]</span>
    </div>
    <span class="status" id="update-status">Loading...</span>
  </div>

  <div class="led-board" id="led-board">
    <a class="ticker-link" id="ticker-item" target="_blank" rel="noopener noreferrer">
      ニュースデータを読み込み中...
    </a>
  </div>

  <div class="footer">
    <span>※ 文字をクリックすると記事を開きます（カーソルを乗せると一時停止）</span>
    <span>AUTO LOOP: TOP 10</span>
  </div>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyO6AwkRjyHI99_6D4DTsT_eQb_jsTe53W0Yte-wsdGg1kQTAkB6SDxT69dpSC6MLWA2Q/exec';

    // ★スクロール速度の調整（1秒間に進むピクセル数。数値を大きくすると速くなります）
    const SCROLL_SPEED = 220;

    let newsList = [];
    let currentIndex = 0;
    let currentX = 0;
    let textWidth = 0;
    let boardWidth = 0;
    let lastTimestamp = null;
    let isPaused = false;
    let animationStarted = false;

    const boardEl = document.getElementById('led-board');
    const tickerEl = document.getElementById('ticker-item');
    const counterEl = document.getElementById('news-counter');
    const statusEl = document.getElementById('update-status');

    // マウスを乗せたら一時停止してクリックしやすくする
    boardEl.addEventListener('mouseenter', () => { isPaused = true; });
    boardEl.addEventListener('mouseleave', () => {
      isPaused = false;
      lastTimestamp = null;
    });

    function setupNextItem() {
      if (newsList.length === 0) return;

      const item = newsList[currentIndex];
      const pubDate = new Date(item.pubDate);
      const timeStr = isNaN(pubDate)
        ? ''
        : `${String(pubDate.getHours()).padStart(2, '0')}:${String(pubDate.getMinutes()).padStart(2, '0')}`;

      counterEl.textContent = `[ ${String(currentIndex + 1).padStart(2, '0')} / ${String(newsList.length).padStart(2, '0')} ]`;
      tickerEl.href = item.link || '#';
      tickerEl.innerHTML = `<span class="ticker-date">${escapeHTML(timeStr)}</span>${escapeHTML(item.title || '')}`;

      // 描画後の幅を計測して右端の外側からスタートさせる
      boardWidth = boardEl.clientWidth;
      textWidth = tickerEl.offsetWidth;
      currentX = boardWidth + 40;
      tickerEl.style.transform = `translateX(${currentX}px)`;
    }

    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaSeconds = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (!isPaused && newsList.length > 0) {
        currentX -= SCROLL_SPEED * deltaSeconds;
        tickerEl.style.transform = `translateX(${currentX}px)`;

        // 文字の右端が画面の左端を完全に抜けたら次のニュースへ
        if (currentX < -textWidth - 40) {
          currentIndex = (currentIndex + 1) % newsList.length;
          setupNextItem();
        }
      }

      requestAnimationFrame(animate);
    }

    async function fetchYahooNews() {
      try {
        const response = await fetch(GAS_API_URL);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const items = await response.json();
        if (!Array.isArray(items) || items.length === 0) {
          throw new Error('記事データが空です');
        }

        // 最新10件を保持
        newsList = items.slice(0, 10);

        const now = new Date();
        statusEl.textContent = `Updated: ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        // 初回読み込み時のみ即座に1件目をセットしてアニメーション開始
        if (!animationStarted) {
          currentIndex = 0;
          setupNextItem();
          animationStarted = true;
          requestAnimationFrame(animate);
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent = 'Error';
        tickerEl.textContent = `エラー: ${error.message}`;
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[match]));
    }

    fetchYahooNews();
    // 30分ごとに最新ニュースへ自動差し替え
    setInterval(fetchYahooNews, 30 * 60 * 1000);
  </script>
</body>
</html>
