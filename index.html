<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>Yahoo news topics</title>
  <style>
    body {
      background: #050508;
      color: #fff;
      font-family: 'Segoe UI', 'Meiryo', sans-serif;
      margin: 0;
      padding: 16px;
      width: 920px;
      height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #00f0ff;
      padding-bottom: 8px;
      margin-bottom: 12px;
      height: 36px;
      flex-shrink: 0;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    .status {
      font-size: 14px;
      color: #8892b0;
    }

    .news-grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }

    .news-card {
      display: flex;
      align-items: center;
      background: #0d1017;
      border: 1px solid #1e2638;
      border-radius: 8px;
      padding: 10px 14px;
      text-decoration: none;
      color: #e6f1ff;
      transition: border-color 0.2s, background 0.2s;
      overflow: hidden;
    }

    .news-card:hover {
      border-color: #00f0ff;
      background: #131824;
    }

    .news-thumb {
      width: 140px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      margin-right: 18px;
      flex-shrink: 0;
      background: #1a2030;
    }

    .news-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      overflow: hidden;
    }

    .news-title {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-date {
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>YAHOO! NEWS TOPICS</h2>
    <span class="status" id="update-status">Loading...</span>
  </div>

  <div class="news-grid" id="news-container"></div>

  <script>
    const NO_IMAGE_SVG = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="140" height="100" viewBox="0 0 140 100">
        <rect width="140" height="100" fill="#161b26"/>
        <text x="50%" y="50%" fill="#475569" font-size="13" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">NO IMAGE</text>
      </svg>
    `);

    async function fetchYahooNews() {
      const container = document.getElementById('news-container');
      const statusEl = document.getElementById('update-status');

      try {
        const response = await fetch(`./news.json?t=${Date.now()}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} (news.jsonが未生成です)`);
        }

        const items = await response.json();
        if (!Array.isArray(items) || items.length === 0) {
          throw new Error('記事データが空です');
        }

        container.innerHTML = '';

        items.slice(0, 4).forEach(item => {
          const imgUrl = item.image || NO_IMAGE_SVG;
          const pubDate = new Date(item.pubDate);
          const timeStr = isNaN(pubDate)
            ? ''
            : `${String(pubDate.getMonth() + 1).padStart(2, '0')}/${String(pubDate.getDate()).padStart(2, '0')} ${String(pubDate.getHours()).padStart(2, '0')}:${String(pubDate.getMinutes()).padStart(2, '0')}`;

          const card = document.createElement('a');
          card.className = 'news-card';
          card.href = item.link || '#';
          card.target = '_blank';
          card.rel = 'noopener noreferrer';

          card.innerHTML = `
            <img class="news-thumb" src="${imgUrl}" alt="" onerror="this.src='${NO_IMAGE_SVG}'">
            <div class="news-info">
              <div class="news-title">${escapeHTML(item.title || '')}</div>
              <div class="news-date">${timeStr}</div>
            </div>
          `;

          container.appendChild(card);
        });

        const now = new Date();
        statusEl.textContent = `Updated: ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      } catch (error) {
        console.error(error);
        statusEl.textContent = 'Error';
        container.innerHTML = `<div style="color:#ff5555; font-size:16px;">
          ${escapeHTML(error.message)}
        </div>`;
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[match]));
    }

    fetchYahooNews();
    // 10分（10 * 60 * 1000ミリ秒）ごとに更新
    setInterval(fetchYahooNews, 10 * 60 * 1000);
  </script>
</body>
</html>
